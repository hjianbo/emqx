dashboard {
    login_encryption {
        mode = required
        public_key = "${EMQX_ETC_DIR}/certs/dashboard_login_rsa_public.pem"
        private_key = "${EMQX_ETC_DIR}/certs/dashboard_login_rsa_private.pem"
    }
    listeners {
        http.bind = 18083
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}
